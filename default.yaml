# Veil Pierce AI default configuration (packaged with the code).
# Override any value from the command line as section.key=value,
# for example: veilpierce benchmark synth.n_companies=50000

synth:
  n_companies: 250000
  seed: 7
  snapshot_date: "2026/09/30"

resolution:
  surname_similarity: 0.92
  forename_similarity: 0.88
  corporate_similarity: 93.0
  sanctions_threshold: 0.86
  sanctions_review_threshold: 0.74
  name_only_cap: 0.8

detect:
  nominee_min_companies: 25
  factory_min_companies: 60
  sanctions_max_hops: 4
  sanctions_hop_decay: 0.75
  control_max_depth: 8
  alert_threshold: 0.5

model:
  n_folds: 5
  seed: 11

rag:
  provider: offline
  model: ""
  top_k_typologies: 4
  max_evidence_items: 40

data_dir: data/generated
artifact_dir: artifacts
report_dir: reports
figure_dir: docs/figures

